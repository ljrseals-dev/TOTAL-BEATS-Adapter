[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sogitech-totalbeats-adapter"
version = "0.1.0"
description = "Adapter between TOTAL BEATS / Neural Tide and Sogitech hybrid DSP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
neural = ["torch>=2.0"]
train = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sogitech_adapter*"]
